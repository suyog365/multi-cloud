name: Build Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t my-hello-app:${{ github.sha }} ./app

      - name: Test the image
        run: |
          docker run -d --name test-container -p 8080:8080 -e CLOUD_NAME=github my-hello-app:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/
          docker stop test-container